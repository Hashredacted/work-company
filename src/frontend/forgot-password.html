<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — WorkSpace</title>
  <meta name="description" content="Reset your WorkSpace account password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src\frontend\css\css/style.css" />
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <div class="auth-container">
    <div class="auth-card" style="max-width:440px;">
      <div class="auth-header">
        <div class="brand" style="justify-content:center;margin-bottom:20px;">
          <div class="brand-logo">
            <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="8" fill="url(#fpBg)" />
              <path d="M8 20L14 8L20 20H8Z" fill="white" opacity="0.9" />
              <defs>
                <linearGradient id="fpBg" x1="0" y1="0" x2="28" y2="28">
                  <stop offset="0%" stop-color="#6366f1" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand-name">WorkSpace</span>
        </div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">Enter your email and we'll generate a reset link for you.</p>
      </div>

      <form id="forgot-form" onsubmit="handleForgot(event)">
        <div class="form-group">
          <label class="form-label" for="fp-email">Email Address</label>
          <input id="fp-email" type="email" class="form-input" placeholder="you@company.com" required
            autocomplete="email" />
        </div>
        <div id="fp-error" class="form-error" style="display:none;"></div>
        <div id="fp-success"
          style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:var(--radius-sm);padding:14px 16px;font-size:0.875rem;color:#4ade80;margin-bottom:16px;line-height:1.5;">
        </div>
        <button type="submit" class="btn-primary" id="fp-btn">Send Reset Link</button>
      </form>

      <div id="reset-url-box"
        style="display:none;margin-top:20px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;">
        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;font-weight:600;">⚡ DEMO MODE — Reset
          URL (normally sent by email):</div>
        <a id="reset-url-link" href="#" style="font-size:0.8rem;color:#38bdf8;word-break:break-all;"></a>
      </div>

      <div style="text-align:center;margin-top:20px;">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);text-decoration:none;">← Back to Sign
          In</a>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const API_BASE = 'http://localhost:5000/api';

    window.handleForgot = async function (e) {
      e.preventDefault();
      const email = document.getElementById('fp-email').value.trim();
      const btn = document.getElementById('fp-btn');
      const errEl = document.getElementById('fp-error');
      const sucEl = document.getElementById('fp-success');
      const resetBox = document.getElementById('reset-url-box');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      resetBox.style.display = 'none';
      btn.textContent = 'Sending…';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const json = await res.json();

        sucEl.textContent = json.message;
        sucEl.style.display = 'block';

        if (json.data && json.data.resetUrl) {
          document.getElementById('reset-url-link').textContent = json.data.resetUrl;
          document.getElementById('reset-url-link').href = json.data.resetUrl;
          resetBox.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Server error. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
      }
    };
  </script>
</body>

</html>
