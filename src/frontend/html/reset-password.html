<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — WorkSpace</title>
  <meta name="description" content="Create a new password for your WorkSpace account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('app_theme') || 'dark');</script>
  <script src="../js/spreadsheet-viewer.js"></script>
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <div class="blob blob-4" aria-hidden="true"></div>
  <div class="blob blob-5" aria-hidden="true"></div>
  <div class="blob blob-6" aria-hidden="true"></div>

  <div class="auth-container">
    <div class="auth-card" style="max-width:440px;">
      <div class="auth-header">
        <div class="brand" style="justify-content:center;margin-bottom:20px;">
          <div class="brand-logo">
            <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="8" fill="url(#rpBg)" />
              <path d="M8 20L14 8L20 20H8Z" fill="white" opacity="0.9" />
              <defs>
                <linearGradient id="rpBg" x1="0" y1="0" x2="28" y2="28">
                  <stop offset="0%" stop-color="#6366f1" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand-name">WorkSpace</span>
          <button type="button" class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme" style="margin-left:12px;">
            <span class="theme-icon">☀️</span> <span class="theme-text">Theme</span>
          </button>
        </div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Choose a strong password for your account.</p>
      </div>

      <div id="invalid-token-msg" style="display:none;text-align:center;padding:30px 0;">
        <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
        <p style="color:#f87171;font-size:0.95rem;">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html"
          style="display:inline-block;margin-top:14px;color:#a5b4fc;font-size:0.85rem;">Request a new link →</a>
      </div>

      <form id="reset-form" onsubmit="handleReset(event)" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="rp-password">New Password</label>
          <input id="rp-password" type="password" class="form-input" placeholder="Min. 6 characters" required
            minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="rp-confirm">Confirm Password</label>
          <input id="rp-confirm" type="password" class="form-input" placeholder="Repeat new password" required />
        </div>
        <div id="rp-error" class="form-error" style="display:none;"></div>
        <div id="rp-success"
          style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:var(--radius-sm);padding:14px 16px;font-size:0.875rem;color:#4ade80;margin-bottom:16px;">
        </div>
        <button type="submit" class="btn-primary" id="rp-btn">Reset Password</button>
      </form>

      <div id="loading-msg" style="text-align:center;color:var(--text-muted);padding:30px 0;">Validating token…</div>

      <div style="text-align:center;margin-top:20px;">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);text-decoration:none;">← Back to Sign
          In</a>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const API_BASE = 'http://localhost:5000/api';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    window.onload = function () {
      document.getElementById('loading-msg').style.display = 'none';
      if (!token) {
        document.getElementById('invalid-token-msg').style.display = 'block';
      } else {
        document.getElementById('reset-form').style.display = 'block';
      }
    };

    window.handleReset = async function (e) {
      e.preventDefault();
      const password = document.getElementById('rp-password').value;
      const confirm = document.getElementById('rp-confirm').value;
      const btn = document.getElementById('rp-btn');
      const errEl = document.getElementById('rp-error');
      const sucEl = document.getElementById('rp-success');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Resetting…';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const json = await res.json();

        if (!res.ok) {
          errEl.textContent = json.message;
          errEl.style.display = 'block';
          if (res.status === 400 && json.message.includes('expired')) {
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('invalid-token-msg').style.display = 'block';
          }
          return;
        }

        sucEl.textContent = '✓ ' + json.message + ' Redirecting to login…';
        sucEl.style.display = 'block';
        document.getElementById('reset-form').querySelectorAll('input,button').forEach(el => el.disabled = true);
        setTimeout(() => { window.location.href = 'index.html'; }, 2500);
      } catch (err) {
        errEl.textContent = 'Server error. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.textContent = 'Reset Password';
        btn.disabled = false;
      }
    };
  </script>
  </body>

</html>
