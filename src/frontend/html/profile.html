<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — WorkSpace</title>
  <meta name="description" content="Manage your personal profile, change password, and view your permissions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      overflow-y: auto;
      display: block;
      padding: 0;
    }

    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      position: relative;
      z-index: 1;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .perm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .perm-tag {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: monospace;
    }

    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #4ade80;
      margin-bottom: 14px;
      display: none;
    }
  </style>
  <script src="../js/spreadsheet-viewer.js"></script>
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <div class="page-container">
    <header class="top-nav">
      <div class="brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#prBg)" />
            <path d="M8 20L14 8L20 20H8Z" fill="white" opacity="0.9" />
            <defs>
              <linearGradient id="prBg" x1="0" y1="0" x2="28" y2="28">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">WorkSpace</span>
      </div>
      <button onclick="goBack()"
        style="background:none;border:1px solid var(--border);color:var(--text-sub);font-size:0.85rem;padding:6px 12px;border-radius:6px;cursor:pointer;">←
        Dashboard</button>
    </header>

    <!-- Profile Info -->
    <div class="profile-card" id="profile-info">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <div style="font-size:1.3rem;font-weight:700;" id="profile-name">Loading...</div>
      <div style="font-size:0.875rem;color:var(--text-muted);" id="profile-email"></div>
      <div style="margin-top:8px;font-size:0.78rem;color:#a5b4fc;font-weight:600;" id="profile-role"></div>
    </div>

    <!-- Edit Name -->
    <div class="profile-card">
      <div class="section-title">✏️ Edit Profile</div>
      <div id="name-success" class="success-msg"></div>
      <form onsubmit="updateName(event)">
        <div class="form-group">
          <label class="form-label" for="new-name">Display Name</label>
          <input id="new-name" type="text" class="form-input" placeholder="Your full name" required minlength="2" />
        </div>
        <div id="name-error" class="form-error" style="display:none;"></div>
        <button type="submit" class="btn-primary" id="name-btn" style="width:auto;padding:10px 20px;">Save Name</button>
      </form>
    </div>

    <!-- Change Password -->
    <div class="profile-card">
      <div class="section-title">🔒 Change Password</div>
      <div id="pwd-success" class="success-msg"></div>
      <form onsubmit="changePassword(event)">
        <div class="form-group">
          <label class="form-label" for="cur-pwd">Current Password</label>
          <input id="cur-pwd" type="password" class="form-input" placeholder="Your current password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="new-pwd">New Password</label>
          <input id="new-pwd" type="password" class="form-input" placeholder="Min. 6 characters" required
            minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-pwd">Confirm New Password</label>
          <input id="confirm-pwd" type="password" class="form-input" placeholder="Repeat new password" required />
        </div>
        <div id="pwd-error" class="form-error" style="display:none;"></div>
        <button type="submit" class="btn-primary" id="pwd-btn" style="width:auto;padding:10px 20px;">Change
          Password</button>
      </form>
    </div>

    <!-- Permissions -->
    <div class="profile-card">
      <div class="section-title">🛡️ My Permissions</div>
      <div id="perms-list" class="perm-grid" style="color:var(--text-muted);font-size:0.85rem;">Loading...</div>
    </div>
  </div>

  <script src="../js/profile.js"></script>
  </body>

</html>
