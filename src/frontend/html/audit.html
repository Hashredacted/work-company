<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Logs — WorkSpace</title>
  <meta name="description" content="View platform audit trail and team login history." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('app_theme') || 'dark');</script>
  <style>
    body {
      overflow-y: auto;
      display: block;
      padding: 0;
    }

    .page-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      position: relative;
      z-index: 1;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .tab-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .table-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      padding: 12px 16px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.82rem;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 12px;
      font-family: var(--font);
    }

    .action-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
  <script src="../js/spreadsheet-viewer.js"></script>
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <div class="blob blob-4" aria-hidden="true"></div>
  <div class="blob blob-5" aria-hidden="true"></div>
  <div class="blob blob-6" aria-hidden="true"></div>

  <div class="page-container">
    <header class="top-nav">
      <div class="brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#bg2)" />
            <path d="M8 20L14 8L20 20H8Z" fill="white" opacity="0.9" />
            <defs>
              <linearGradient id="bg2" x1="0" y1="0" x2="28" y2="28">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">WorkSpace</span>
        <span style="font-size:0.75rem;color:#38bdf8;font-weight:600;margin-left:6px;">Audit &amp; Activity</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
          <span class="theme-icon">☀️</span> <span class="theme-text">Theme</span>
        </button>
        <button onclick="goBack()"
          style="background:none;border:1px solid var(--border);color:var(--text-sub);font-size:0.85rem;padding:6px 12px;border-radius:6px;cursor:pointer;">←
          Dashboard</button>
      </div>
    </header>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-activity" onclick="switchTab('activity')">Activity Logs</button>
      <button class="tab-btn" id="tab-logins" onclick="switchTab('logins')">Login History</button>
    </div>

    <!-- Activity Logs -->
    <section id="section-activity" class="content-section active">
      <div class="filter-row" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="text" id="filter-action" class="filter-input" placeholder="Filter by action..."
            oninput="debouncedLoad()" />
          <select id="filter-resource" class="filter-input" onchange="loadAuditLogs()">
            <option value="">All Resources</option>
            <option value="auth">Auth</option>
            <option value="user">User</option>
            <option value="role">Role</option>
            <option value="company">Company</option>
            <option value="subscription">Subscription</option>
          </select>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button type="button" onclick="previewAuditInBrowser()" style="background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.35);color:#38bdf8;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
            <span>👁️</span> View in Browser
          </button>
          <button type="button" onclick="exportAuditToExcel()" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#4ade80;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
            <span>📥</span> Export to Excel
          </button>
        </div>
      </div>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th style="width: 45px; text-align: center;">#</th>
              <th>Action</th>
              <th>Resource</th>
              <th>User</th>
              <th>Details</th>
              <th>IP</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="audit-tbody">
            <tr>
              <td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted);">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Login History -->
    <section id="section-logins" class="content-section">
      <div style="display:flex;justify-content:flex-end;gap:6px;align-items:center;margin-bottom:12px;">
        <button type="button" onclick="previewAuditInBrowser()" style="background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.35);color:#38bdf8;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
          <span>👁️</span> View in Browser
        </button>
        <button type="button" onclick="exportAuditToExcel()" style="background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.35);color:#4ade80;padding:8px 14px;border-radius:var(--radius-sm);font-size:0.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
          <span>📥</span> Export to Excel
        </button>
      </div>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th style="width: 45px; text-align: center;">#</th>
              <th>User</th>
              <th>Email</th>
              <th>IP Address</th>
              <th>User Agent</th>
              <th>Login Time</th>
            </tr>
          </thead>
          <tbody id="logins-tbody">
            <tr>
              <td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted);">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../js/audit.js"></script>
</body>

</html>
