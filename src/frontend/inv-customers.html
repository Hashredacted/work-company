<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — WorkSpace Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      overflow-y: auto;
      display: block;
      padding: 0;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      position: relative;
      z-index: 1;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .inv-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inv-nav a {
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .inv-nav a.active {
      background: var(--primary);
      color: #fff;
    }

    .inv-nav a:not(.active) {
      background: var(--surface-2);
      color: var(--text-sub);
      border: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      padding: 12px 16px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-sub);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .gstin-tag {
      font-family: monospace;
      font-size: 0.78rem;
      background: rgba(74, 222, 128, 0.08);
      color: #4ade80;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .state-tag {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.08);
      color: #38bdf8;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex !important;
    }

    .modal {
      background: #14162b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 720px;
      padding: 28px;
      margin: auto;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media(max-width:600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
      width: 100%;
    }

    .section-divider {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 18px 0 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
  </style>
</head>

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="page">
    <header class="top-nav">
      <div>
        <div class="brand" style="margin-bottom:6px;">
          <div class="brand-logo"><svg width="26" height="26" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="8" fill="url(#cG)" />
              <path d="M8 20L14 8L20 20H8Z" fill="white" opacity="0.9" />
              <defs>
                <linearGradient id="cG" x1="0" y1="0" x2="28" y2="28">
                  <stop offset="0%" stop-color="#6366f1" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg></div><span class="brand-name">WorkSpace</span><span
            style="font-size:0.7rem;font-weight:700;background:rgba(16,185,129,0.2);color:#34d399;padding:2px 8px;border-radius:10px;margin-left:4px;">📦
            INVENTORY</span>
        </div>
        <div class="inv-nav">
          <a href="inv-dashboard.html">📊 Dashboard</a>
          <a href="inv-products.html">📦 Products</a>
          <a href="inv-suppliers.html">🏭 Suppliers</a>
          <a href="inv-customers.html" class="active">👥 Customers</a>
          <a href="inv-payments.html">💳 Payments</a>
          <a href="inv-outstandings.html">💰 Outstandings</a>
          <a href="inv-reports.html">📈 Reports</a>
        </div>
      </div>
      <div style="display:flex;gap:10px;"><a id="main-nav-link" href="company-dashboard.html"
          style="font-size:0.8rem;color:var(--text-muted);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:6px;">←
          Main</a><button id="logout-btn"
          style="background:none;border:1px solid var(--border);color:var(--text-sub);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;">Sign
          Out</button></div>
    </header>
    <div class="toolbar">
      <input id="search" class="search-box" type="text" placeholder="🔍 Search name or GSTIN…" oninput="debounce()" />
      <button onclick="openModal()"
        style="background:var(--primary);color:#fff;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:600;">+
        Add Customer</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>GSTIN</th>
            <th>State</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Credit Limit</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="cus-tbody">
          <tr>
            <td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="modal-overlay" id="cus-modal">
    <div class="modal">
      <div class="modal-title" id="modal-title">Add Customer</div>
      <form id="cus-form" onsubmit="saveCustomer(event)">
        <input type="hidden" id="edit-id" />
        <div class="form-grid">
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Business / Customer Name
              *</label><input id="f-name" class="form-input" type="text" required /></div>
          <div class="form-group"><label class="form-label">GSTIN</label><input id="f-gstin" class="form-input"
              type="text" maxlength="15" placeholder="27AABCU9603R1ZM"
              style="font-family:monospace;text-transform:uppercase;" /></div>
          <div class="form-group"><label class="form-label">PAN</label><input id="f-pan" class="form-input" type="text"
              maxlength="10" style="font-family:monospace;text-transform:uppercase;" /></div>
          <div class="form-group"><label class="form-label">Contact Person</label><input id="f-contact"
              class="form-input" type="text" /></div>
          <div class="form-group"><label class="form-label">Phone</label><input id="f-phone" class="form-input"
              type="tel" /></div>
          <div class="form-group"><label class="form-label">Email</label><input id="f-email" class="form-input"
              type="email" /></div>
          <div class="form-group"><label class="form-label">State</label><input id="f-state" class="form-input"
              type="text" /></div>
          <div class="form-group"><label class="form-label">GST State Code</label><input id="f-state-code"
              class="form-input" type="text" maxlength="2" placeholder="27" /></div>
          <div class="form-group"><label class="form-label">City</label><input id="f-city" class="form-input"
              type="text" /></div>
          <div class="form-group"><label class="form-label">Pincode</label><input id="f-pin" class="form-input"
              type="text" maxlength="6" /></div>
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Billing Address</label><input
              id="f-billing-addr" class="form-input" type="text" /></div>
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Shipping Address</label><input
              id="f-shipping-addr" class="form-input" type="text" placeholder="Leave blank if same as billing" /></div>
        </div>
        <div class="section-divider">💰 Credit Terms</div>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Payment Terms (days)</label><input id="f-terms"
              class="form-input" type="number" min="0" value="0" /></div>
          <div class="form-group"><label class="form-label">Credit Limit (₹)</label><input id="f-credit"
              class="form-input" type="number" min="0" value="0" /></div>
        </div>
        <div id="cus-error" class="form-error" style="display:none;margin-top:12px;"></div>
        <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
          <button type="button" onclick="closeModal()"
            style="background:none;border:1px solid var(--border);color:var(--text-sub);padding:9px 20px;border-radius:8px;cursor:pointer;">Cancel</button>
          <button type="submit" id="save-btn" class="btn-primary" style="width:auto;padding:9px 24px;">Save
            Customer</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    'use strict';
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('auth_token');
    if (!token) window.location.href = 'index.html';

    const user = JSON.parse(localStorage.getItem('auth_user') || '{}');
    const mainNav = document.getElementById('main-nav-link');
    if (mainNav) {
      mainNav.href = user.isSuperAdmin ? 'dashboard.html' : 'company-dashboard.html';
    }

    const H = () => ({ 'Content-Type': 'application/json', Authorization: `Bearer ${token}` });
    function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
    document.getElementById('logout-btn').addEventListener('click', () => { localStorage.clear(); window.location.href = 'index.html'; });
    let debounceTimer;
    function debounce() { clearTimeout(debounceTimer); debounceTimer = setTimeout(load, 300); }

    let rawCustomersList = [];
    async function load() {
      const tbody = document.getElementById('cus-tbody');
      try {
        const search = document.getElementById('search').value;
        const params = new URLSearchParams({ ...(search && { search }) });
        const r = await fetch(`${API}/inventory/customers?${params}`, { headers: H() });
        if (r.status === 401) {
          localStorage.clear();
          window.location.href = 'index.html';
          return;
        }
        if (r.status === 403) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--error);">🔒 Access Restricted: Insufficient permissions to view customers.</td></tr>`;
          return;
        }
        const { data } = await r.json();
        rawCustomersList = data?.items || [];
        if (!rawCustomersList.length) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No customers found. Click "+ Add Customer" to add one.</td></tr>`; return; }
        tbody.innerHTML = rawCustomersList.map(c => `
          <tr>
            <td><div style="font-weight:600;color:var(--text);">${c.name}</div><div style="font-size:0.72rem;color:var(--text-muted);">${c.city || ''}${c.city && c.email ? ' · ' : ''}${c.email || ''}</div></td>
            <td>${c.gstin ? `<span class="gstin-tag">${c.gstin}</span>` : '—'}</td>
            <td>${c.state ? `<span class="state-tag">${c.state} (${c.stateCode || '??'})</span>` : '—'}</td>
            <td>${c.contactName || '—'}</td>
            <td>${c.phone || '—'}</td>
            <td>${c.creditLimit ? inr(c.creditLimit) : 'COD'}</td>
            <td><button onclick="editCustomer('${c._id}')" style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);color:#a5b4fc;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.78rem;">Edit</button></td>
          </tr>`).join('');
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--error);">Failed to load customers.</td></tr>`;
      }
    }

    function openModal(d = null, e = null) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      document.getElementById('modal-title').textContent = d ? 'Edit Customer' : 'Add Customer';
      document.getElementById('edit-id').value = d?._id || '';
      document.getElementById('f-name').value = d?.name || '';
      document.getElementById('f-gstin').value = d?.gstin || '';
      document.getElementById('f-pan').value = d?.pan || '';
      document.getElementById('f-contact').value = d?.contactName || '';
      document.getElementById('f-phone').value = d?.phone || '';
      document.getElementById('f-email').value = d?.email || '';
      document.getElementById('f-state').value = d?.state || '';
      document.getElementById('f-state-code').value = d?.stateCode || '';
      document.getElementById('f-city').value = d?.city || '';
      document.getElementById('f-pin').value = d?.pincode || '';
      document.getElementById('f-billing-addr').value = d?.billingAddress || '';
      document.getElementById('f-shipping-addr').value = d?.shippingAddress || '';
      document.getElementById('f-terms').value = d?.paymentTerms || 0;
      document.getElementById('f-credit').value = d?.creditLimit || 0;
      document.getElementById('cus-error').style.display = 'none';
      document.getElementById('cus-modal').classList.add('show');
    }
    function editCustomer(id, e = null) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      const c = rawCustomersList.find(x => x._id === id);
      openModal(c);
    }
    function closeModal() { document.getElementById('cus-modal').classList.remove('show'); }

    // Safe backdrop click handling
    const cusModalOverlay = document.getElementById('cus-modal');
    let isCusBackdropDown = false;
    cusModalOverlay.addEventListener('mousedown', e => {
      isCusBackdropDown = (e.target === cusModalOverlay);
    });
    cusModalOverlay.addEventListener('mouseup', e => {
      if (isCusBackdropDown && e.target === cusModalOverlay) {
        closeModal();
      }
      isCusBackdropDown = false;
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Window bindings
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.editCustomer = editCustomer;
    window.saveCustomer = saveCustomer;

    async function saveCustomer(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const btn = document.getElementById('save-btn');
      btn.textContent = 'Saving…'; btn.disabled = true;
      const errEl = document.getElementById('cus-error');
      const body = {
        name: document.getElementById('f-name').value,
        gstin: document.getElementById('f-gstin').value.toUpperCase() || null,
        pan: document.getElementById('f-pan').value.toUpperCase() || null,
        contactName: document.getElementById('f-contact').value,
        phone: document.getElementById('f-phone').value,
        email: document.getElementById('f-email').value,
        state: document.getElementById('f-state').value,
        stateCode: document.getElementById('f-state-code').value,
        city: document.getElementById('f-city').value,
        pincode: document.getElementById('f-pin').value,
        billingAddress: document.getElementById('f-billing-addr').value,
        shippingAddress: document.getElementById('f-shipping-addr').value,
        paymentTerms: Number(document.getElementById('f-terms').value) || 0,
        creditLimit: Number(document.getElementById('f-credit').value) || 0,
      };
      try {
        const url = id ? `${API}/inventory/customers/${id}` : `${API}/inventory/customers`;
        const method = id ? 'PUT' : 'POST';
        const r = await fetch(url, { method, headers: H(), body: JSON.stringify(body) });
        const json = await r.json();
        if (!r.ok) {
          errEl.textContent = json.message || 'Failed to save';
          errEl.style.display = 'block';
          return;
        }
        closeModal();
        load();
      } catch (err) {
        errEl.textContent = 'Server error.';
        errEl.style.display = 'block';
      } finally {
        btn.textContent = 'Save Customer';
        btn.disabled = false;
      }
    }
    load();
  </script>
</body>

</html>
